<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>AR Kelompok 5 - Minggu 2 (Scene v1)</title>
  <!-- Library A-Frame dan AR.js -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
  <!-- Scene Utama AR.js -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- ================= PENCAHAYAAN (LIGHTING) ================= -->
    <a-light id="lampu-ambient" type="ambient" color="#ffffff" intensity="0.6"></a-light>
    <a-light id="lampu-directional" type="directional" color="#ffffff" intensity="0.8" position="1 3 2"></a-light>

    <!-- ================= MARKER HIRO ================= -->
    <a-marker id="marker-hiro" preset="hiro">
      
      <!-- 1. ALAS SCENE -->
      <a-plane id="alas-scene" 
               position="0 0 0" 
               rotation="-90 0 0" 
               width="2" 
               height="2"
               color="#e9e5fa" 
               opacity="0.7" 
               transparent="true">
      </a-plane>

      <!-- 2. KELOMPOK OBJEK 3D UTAMA -->
      <a-entity id="kelompok-objek-utama" position="0 0 0" scale="1 1 1">
        
        <!-- Objek 1: Kubus Biru -->
        <a-box id="kubus-biru" 
               position="-0.6 0.25 0" 
               rotation="0 45 0"
               width="0.5" 
               height="0.5" 
               depth="0.5"
               color="#4C6EF5">
        </a-box>

        <!-- Objek 2: Bola Oranye -->
        <a-sphere id="bola-oranye" 
                  position="0 0.3 0" 
                  radius="0.3"
                  color="#D9531E" 
                  metalness="0.3" 
                  roughness="0.4">
        </a-sphere>

        <!-- Objek 3: Silinder Hijau (Berputar) -->
        <a-cylinder id="silinder-hijau" 
                    position="0.6 0.3 0" 
                    radius="0.2" 
                    height="0.6" 
                    color="#0B7F73"
                    animation="property: rotation; to: 0 360 0; dur: 4000; loop: true; easing: linear">
        </a-cylinder>

        <!-- Objek 4: Kotak Bertekstur (Mengambil gambar dari folder assets/tekstur.jpg) -->
        <a-box id="kotak-tekstur" 
               position="0 0.15 0.7" 
               width="0.5" 
               height="0.3" 
               depth="0.5"
               src="assets/tekstur.jpg">
        </a-box>

      </a-entity>
    </a-marker>

    <!-- Kamera AR -->
    <a-entity id="kamera-utama" camera></a-entity>
  </a-scene>
</body>
</html>
